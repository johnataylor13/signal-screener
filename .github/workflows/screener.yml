name: Weekly Stock Screener

on:
  schedule:
    # Every Wednesday at 10pm UTC = 6pm ET (2hr after market close), available Thursday morning
    - cron: '0 22 * * 3'
  workflow_dispatch:  # manual trigger for testing

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screen.py

      - name: Move report into docs and rebuild index
        run: |
          mkdir -p docs
          mv signal_*.html docs/
          python build_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Signal report $(date +%Y-%m-%d)"
          git push
